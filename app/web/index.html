<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MIRA — JARVIS HUD</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020407;color:#eef2f6;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,textarea{font:inherit}button{cursor:pointer}body{background:radial-gradient(circle at 50% 48%,rgba(30,22,4,.34),transparent 30%),radial-gradient(circle at 50% 100%,rgba(12,31,48,.2),transparent 45%),#020407}.hud{position:relative;width:100%;height:100%;overflow:hidden}.scan{position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px);background-size:100% 5px;opacity:.25;z-index:0}.grid{position:absolute;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(rgba(245,200,75,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(245,200,75,.05) 1px,transparent 1px);background-size:70px 70px;mask-image:radial-gradient(circle at center,#000 0,transparent 72%);z-index:0}.top{position:absolute;top:0;left:0;right:0;height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;z-index:10}.brand{display:flex;align-items:center;gap:13px}.mini-orb{width:38px;height:38px;border:1px solid rgba(245,200,75,.6);border-radius:50%;display:grid;place-items:center;color:#ffe89a;font-weight:800;box-shadow:0 0 24px rgba(245,200,75,.14),inset 0 0 18px rgba(245,200,75,.08)}.brand b{font-size:17px;letter-spacing:7px}.brand small{display:block;color:#65707d;font-size:8px;letter-spacing:2.4px;margin-top:3px}.status{display:flex;align-items:center;gap:9px;color:#87919e;font-size:10px;letter-spacing:1.8px;text-transform:uppercase}.dot{width:7px;height:7px;border-radius:50%;background:#39e99a;box-shadow:0 0 13px #39e99a}.corner{display:flex;gap:8px}.hud-btn{border:1px solid rgba(255,255,255,.08);background:rgba(8,12,17,.72);color:#8f99a5;border-radius:10px;padding:8px 11px;font-size:10px;backdrop-filter:blur(12px)}.hud-btn:hover{color:#fff;border-color:rgba(245,200,75,.35)}.stage{position:absolute;inset:76px 0 0;display:flex;flex-direction:column;align-items:center;z-index:2}.readout{margin-top:7px;text-align:center;min-height:43px}.state{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:#697581}.substate{font-size:9px;color:#414c58;margin-top:7px;letter-spacing:1px}.reactor{position:relative;width:min(52vw,430px);height:min(52vw,430px);margin-top:1vh;display:grid;place-items:center}.reactor:before{content:"";position:absolute;width:76%;height:76%;border-radius:50%;background:radial-gradient(circle,rgba(245,200,75,.11),rgba(255,90,20,.025) 38%,transparent 68%);filter:blur(13px);animation:breath 3s ease-in-out infinite}.reactor:after{content:"";position:absolute;width:55%;height:55%;border-radius:50%;border:1px solid rgba(245,200,75,.14);box-shadow:0 0 60px rgba(245,200,75,.06),inset 0 0 45px rgba(245,200,75,.04)}.core{position:relative;width:48%;height:48%;border-radius:50%;background:radial-gradient(circle at 48% 44%,#121416 0 18%,#050709 42%,transparent 43%),radial-gradient(circle,#f5c84b 0 1%,#a16e13 2%,transparent 52%);box-shadow:0 0 45px rgba(245,200,75,.16),0 0 100px rgba(245,200,75,.06);animation:float 5s ease-in-out infinite;z-index:3}.ring{position:absolute;border:1px solid rgba(245,200,75,.28);border-radius:50%;transform:rotate(-18deg);animation:spin 11s linear infinite}.ring.r1{inset:14%;border-left-color:rgba(245,200,75,.7);border-right-color:transparent}.ring.r2{inset:3%;transform:rotate(55deg);animation-direction:reverse;border-top-color:rgba(255,100,25,.45);border-bottom-color:transparent}.ring.r3{inset:25%;border-color:rgba(35,140,255,.22);transform:rotate(72deg);animation-duration:8s}.core:before,.core:after{content:"";position:absolute;inset:20%;border-radius:50%;border:1px dotted rgba(255,235,150,.26);animation:spin 6s linear infinite}.core:after{inset:31%;border-color:rgba(35,145,255,.25);animation-direction:reverse}.core-label{position:absolute;inset:0;display:grid;place-items:center;z-index:5;font-size:17px;letter-spacing:6px;color:#ffe9a0;text-shadow:0 0 18px rgba(245,200,75,.55)}.metrics{position:absolute;left:28px;right:28px;bottom:150px;display:flex;justify-content:space-between;align-items:flex-end;z-index:4;pointer-events:none}.metric{font-size:8px;letter-spacing:2px;color:#4c5865;text-transform:uppercase}.metric b{display:block;color:#8b96a2;font-size:10px;margin-top:5px;letter-spacing:1px}.metric.right{text-align:right}.chat{position:absolute;left:50%;transform:translateX(-50%);bottom:145px;width:min(760px,calc(100% - 36px));max-height:27vh;overflow:auto;display:flex;flex-direction:column;gap:8px;scrollbar-width:none}.chat::-webkit-scrollbar{display:none}.msg{display:flex;justify-content:center}.bubble{max-width:80%;padding:8px 13px;border-radius:12px;font-size:12px;line-height:1.55;white-space:pre-wrap;background:rgba(5,9,13,.72);border:1px solid rgba(255,255,255,.06);backdrop-filter:blur(8px);text-align:center}.msg.user .bubble{color:#d6dce3;border-color:rgba(245,200,75,.14)}.msg.assistant .bubble{color:#e8c95f;border-color:rgba(245,200,75,.16)}.typing{opacity:.65}.composer{position:absolute;left:50%;bottom:27px;transform:translateX(-50%);width:min(720px,calc(100% - 28px));z-index:12}.box{height:58px;border:1px solid rgba(245,200,75,.28);background:rgba(4,8,12,.88);border-radius:30px;display:flex;align-items:center;gap:8px;padding:6px 7px 6px 17px;box-shadow:0 0 35px rgba(0,0,0,.55),0 0 30px rgba(245,200,75,.04);backdrop-filter:blur(18px)}.box:focus-within{border-color:rgba(245,200,75,.6);box-shadow:0 0 0 1px rgba(245,200,75,.08),0 0 40px rgba(245,200,75,.08)}textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:#f5f6f7;min-height:40px;max-height:100px;padding:9px 0;line-height:1.35}textarea::placeholder{color:#4f5a66}.round{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.08);background:#0b1016;color:#aeb6c0;display:grid;place-items:center;font-size:17px}.round:hover{color:#fff;border-color:rgba(245,200,75,.4)}.send{background:linear-gradient(145deg,#ffe78d,#d69e1d);color:#171208;border:0}.send:disabled{opacity:.45}.tools{display:flex;justify-content:center;gap:8px;margin-top:9px}.tool{border:0;background:transparent;color:#4e5965;font-size:8px;letter-spacing:1.5px;text-transform:uppercase}.tool:hover{color:#a9b1bb}.toast{position:absolute;left:50%;top:83px;transform:translate(-50%,-10px);opacity:0;padding:7px 12px;border:1px solid rgba(245,200,75,.25);background:rgba(6,10,14,.9);border-radius:9px;color:#bdc5ce;font-size:10px;transition:.25s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}.side-info{position:absolute;top:110px;width:170px;z-index:5;color:#424d59;font-size:8px;letter-spacing:1.6px;text-transform:uppercase}.side-info.left{left:28px}.side-info.right{right:28px;text-align:right}.line{height:1px;background:linear-gradient(90deg,rgba(245,200,75,.28),transparent);margin:8px 0}.right .line{background:linear-gradient(270deg,rgba(245,200,75,.28),transparent)}@keyframes spin{to{transform:rotate(342deg)}}@keyframes breath{0%,100%{transform:scale(.92);opacity:.6}50%{transform:scale(1.08);opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@media(max-width:700px){.top{height:62px;padding:0 15px}.brand b{font-size:14px;letter-spacing:5px}.brand small{font-size:7px}.corner .hud-btn:first-child{display:none}.stage{inset:62px 0 0}.reactor{width:86vw;height:86vw;margin-top:3vh}.core{width:45%;height:45%}.side-info{display:none}.metrics{left:15px;right:15px;bottom:151px}.chat{bottom:143px;max-height:23vh;width:calc(100% - 24px)}.bubble{max-width:92%;font-size:11px}.composer{bottom:18px;width:calc(100% - 20px)}.box{height:56px}.tools{display:none}.readout{margin-top:3px}.state{font-size:8px;letter-spacing:3px}.substate{font-size:8px}.mini-orb{width:34px;height:34px}.status{font-size:8px;letter-spacing:1px}}
</style>
</head>
<body>
<div class="hud">
<div class="grid"></div><div class="scan"></div>
<header class="top"><div class="brand"><div class="mini-orb">M</div><div><b>MIRA</b><small>PERSONAL INTELLIGENCE SYSTEM</small></div></div><div class="status"><span class="dot"></span><span id="status">SYSTEM ONLINE</span></div><div class="corner"><button class="hud-btn" onclick="newChat()">NEW SESSION</button><button class="hud-btn" onclick="voiceInput()">MIC</button></div></header>
<div class="side-info left">CORE TELEMETRY<div class="line"></div>NEURAL LINK <b>ACTIVE</b><br><br>MEMORY <b>READY</b><br><br>VOICE <b>READY</b></div>
<div class="side-info right">MIRA HUD<div class="line"></div>MODE <b id="mode">STANDBY</b><br><br>SESSION <b id="sessionLabel">LOCAL</b><br><br>LATENCY <b>LIVE</b></div>
<main class="stage">
<div class="readout"><div class="state" id="state">STANDBY</div><div class="substate">AWAITING COMMAND, BOSS</div></div>
<div class="reactor" id="reactor"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="core"><div class="core-label">MIRA</div></div></div>
</main>
<div class="metrics"><div class="metric">CORE STATUS<b>100% ONLINE</b></div><div class="metric right">AI ENGINE<b>GEMINI</b></div></div>
<section class="chat" id="chat"></section>
<section class="composer"><div class="box"><button class="round" onclick="voiceInput()" title="Voice input">⌁</button><textarea id="input" rows="1" placeholder="Talk to MIRA, Boss…" onkeydown="key(event)" oninput="resize(this)"></textarea><button class="round send" id="sendBtn" onclick="send()">➤</button></div><div class="tools"><button class="tool" onclick="newChat()">NEW</button><button class="tool" onclick="toast('Web search mode ready')">SEARCH</button><button class="tool" onclick="document.getElementById('file').click()">FILES</button><button class="tool" onclick="toast('Memory system ready')">MEMORY</button></div></section>
<input id="file" type="file" accept=".txt,.md,.pdf" hidden onchange="uploadDoc(this)"><div class="toast" id="toast"></div>
</div>
<script>
const input=document.getElementById('input'),chat=document.getElementById('chat'),sendBtn=document.getElementById('sendBtn');let session=localStorage.getItem('mira_session')||'boss',busy=false;
function resize(e){e.style.height='auto';e.style.height=Math.min(e.scrollHeight,100)+'px'}
function key(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.classList.remove('show'),1800)}
function setState(s){document.getElementById('state').textContent=s;document.getElementById('mode').textContent=s}
function add(role,text){const row=document.createElement('div');row.className='msg '+role;const b=document.createElement('div');b.className='bubble';b.textContent=text;row.appendChild(b);chat.appendChild(row);chat.scrollTop=chat.scrollHeight;return b}
async function send(){const text=input.value.trim();if(!text||busy)return;busy=true;sendBtn.disabled=true;input.value='';resize(input);add('user',text);setState('THINKING');document.getElementById('status').textContent='PROCESSING';const bubble=add('assistant','');bubble.classList.add('typing');let full='';try{const r=await fetch('/api/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,session_id:session})});if(!r.ok)throw Error('Request failed ('+r.status+')');const reader=r.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const part=await reader.read();if(part.done)break;buffer+=decoder.decode(part.value,{stream:true});const lines=buffer.split('\n');buffer=lines.pop();for(const line of lines){if(!line.trim())continue;const d=JSON.parse(line);if(d.error)throw Error(d.error);if(d.delta){full+=d.delta;bubble.textContent=full;chat.scrollTop=chat.scrollHeight}}}bubble.classList.remove('typing');bubble.textContent=full||'Boss, empty response mila.';setState('SPEAKING');document.getElementById('status').textContent='VOICE OUTPUT';await speak(full);setState('STANDBY');document.getElementById('status').textContent='SYSTEM ONLINE';}catch(e){bubble.classList.remove('typing');bubble.textContent='Boss, backend error: '+e.message;setState('ERROR');document.getElementById('status').textContent='CHECK CONNECTION'}finally{busy=false;sendBtn.disabled=false;input.focus()}}
async function speak(text){if(!text)return;try{const r=await fetch('/api/voice/speak',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});if(!r.ok)throw Error();const blob=await r.blob();const url=URL.createObjectURL(blob);const a=new Audio(url);a.onended=()=>URL.revokeObjectURL(url);await a.play()}catch(e){try{const u=new SpeechSynthesisUtterance(text);u.lang='hi-IN';u.rate=.94;u.pitch=1.02;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(_){}}}
function voiceInput(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Voice input browser me supported nahi hai');return}const r=new SR();r.lang='hi-IN';r.interimResults=false;r.onstart=()=>setState('LISTENING');r.onresult=e=>{input.value=e.results[0][0].transcript;resize(input);send()};r.onerror=()=>setState('STANDBY');r.onend=()=>{if(!busy)setState('STANDBY')};r.start()}
async function loadMessages(){try{const r=await fetch('/api/sessions/'+encodeURIComponent(session)+'/messages?limit=100');const d=await r.json();chat.innerHTML='';(d.messages||[]).forEach(x=>add(x.role,x.content))}catch(e){}}
function newChat(){if(busy)return;session='boss-'+Date.now();localStorage.setItem('mira_session',session);chat.innerHTML='';fetch('/api/sessions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:session,title:'MIRA HUD Session'})});setState('STANDBY');toast('New MIRA session started')}
async function uploadDoc(el){const f=el.files?.[0];if(!f)return;const fd=new FormData();fd.append('file',f);try{const r=await fetch('/api/files/upload',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw Error(d.detail||'Upload failed');add('assistant','Boss, '+d.file+' upload ho gaya.');}catch(e){add('assistant','Boss, file upload nahi hua: '+e.message)}el.value=''}
async function boot(){try{const r=await fetch('/api/health');if(r.ok){document.getElementById('status').textContent='SYSTEM ONLINE'}}catch(e){document.getElementById('status').textContent='OFFLINE'}await loadMessages()}boot();input.focus();
</script>
</body>
</html>
