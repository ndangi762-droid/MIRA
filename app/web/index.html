<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIRA — Personal AI</title><style>:root{--bg:#080a0f;--panel:#11151d;--line:#292f3b;--text:#f5f7fb;--muted:#8e97a8;--accent:#f4c542;--user:#202633}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% -10%,#24200e,transparent 35%),var(--bg);color:var(--text);font:15px system-ui,sans-serif;height:100vh;overflow:hidden}.app{height:100vh;display:grid;grid-template-columns:270px 1fr}.side{border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:14px;background:#0a0c11e8}.brand{display:flex;gap:12px;align-items:center}.orb{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#fff1a8,var(--accent));display:grid;place-items:center;color:#151515;font-weight:900}.brand small{display:block;color:var(--muted);font-size:11px}.new,.upload{border:1px solid #3a3f4b;background:#151923;color:var(--text);border-radius:12px;padding:11px;text-align:left;cursor:pointer}.history-title{font-size:11px;color:var(--muted);text-transform:uppercase}.sessions{overflow:auto;display:flex;flex-direction:column;gap:5px}.session{border:1px solid transparent;background:transparent;color:var(--text);border-radius:10px;padding:10px;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.session.active{background:#1b202b;border-color:#343b49}.status{margin-top:auto;border:1px solid var(--line);border-radius:14px;padding:12px;background:#0e1117}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#51d88a;margin-right:7px}.main{min-width:0;display:flex;flex-direction:column}.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.model{color:var(--muted);font-size:12px}.actions{display:flex;gap:6px}.icon{width:40px;height:40px;border:0;border-radius:12px;background:transparent;color:var(--muted);cursor:pointer;font-size:18px}.icon:hover,.icon.active{background:#20242d;color:var(--text)}.chat{flex:1;overflow:auto;padding:28px max(20px,calc((100% - 900px)/2))}.welcome{min-height:70%;display:grid;place-items:center;text-align:center}.welcome h1{font-size:42px;margin:8px 0;background:linear-gradient(90deg,#fff,var(--accent));-webkit-background-clip:text;color:transparent}.welcome p{color:var(--muted);max-width:560px;line-height:1.7}.msg{display:flex;margin:18px 0}.msg.user{justify-content:flex-end}.bubble{max-width:78%;padding:13px 16px;border-radius:18px;line-height:1.55;white-space:pre-wrap}.assistant .bubble{padding-left:0}.user .bubble{background:var(--user);border:1px solid #2b3240}.typing{color:var(--muted)}.composer{padding:14px max(20px,calc((100% - 900px)/2)) 20px}.box{border:1px solid #303644;background:#11151d;border-radius:18px;padding:10px;display:flex;align-items:flex-end;gap:8px}.box textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;max-height:150px;padding:8px}.send{background:var(--accent);color:#111;font-weight:800}.panel{position:fixed;right:18px;top:76px;width:330px;max-height:70vh;overflow:auto;background:#11151d;border:1px solid var(--line);border-radius:16px;padding:16px;display:none;z-index:5}.panel.show{display:block}.memory{padding:9px;border:1px solid var(--line);border-radius:10px;margin:7px 0;font-size:12px}.memory b{display:block;color:var(--accent)}@media(max-width:720px){.app{grid-template-columns:1fr}.side{display:none}.top{padding:0 14px}.chat,.composer{padding-left:14px;padding-right:14px}.bubble{max-width:88%}}</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="orb">M</div><div><b>MIRA</b><small>Personal AI Assistant</small></div></div><button class="new" onclick="newChat()">＋ New conversation</button><button class="upload" onclick="document.getElementById('file').click()">📎 Upload document</button><input id="file" type="file" accept=".txt,.md,.pdf" hidden onchange="uploadDoc(this)"><div class="history-title">Recent conversations</div><div class="sessions" id="sessions">Loading…</div><div class="status"><span class="dot"></span><b id="statusText">Connecting</b><div id="sideStatus" style="color:var(--muted);font-size:11px;margin-top:5px">Starting MIRA…</div></div></aside><main class="main"><header class="top"><div><b>MIRA</b><div class="model" id="model">Local AI • Ollama • Streaming</div></div><div class="actions"><button class="icon" id="voiceOutBtn" onclick="toggleVoiceOutput()" title="Voice output">🔇</button><button class="icon" onclick="stopSpeaking()" title="Stop speaking">⏹️</button><button class="icon" onclick="toggleMemory()" title="Memory">🧠</button></div></header><section class="chat" id="chat"><div class="welcome" id="welcome"><div><div style="font-size:50px">✦</div><h1>Hello, Boss.</h1><p>MIRA is ready. Chat, memory, local tools, documents and voice.</p></div></div></section><section class="composer"><div class="box"><button class="icon" onclick="voice()" title="Voice input">🎙️</button><textarea id="input" rows="1" placeholder="Message MIRA…" onkeydown="key(event)" oninput="resize(this)"></textarea><button class="icon send" id="sendBtn" onclick="send()">➤</button></div><div style="text-align:center;color:#626b7c;font-size:11px;margin-top:8px">MIRA V7.4 • streaming • optional voice output • Enter to send</div></section></main></div><div class="panel" id="memoryPanel"><h3>🧠 MIRA Memory</h3><div id="memories">Loading…</div></div><script>
const chat=document.getElementById('chat'),input=document.getElementById('input'),sendBtn=document.getElementById('sendBtn'),voiceOutBtn=document.getElementById('voiceOutBtn');let session=localStorage.getItem('mira_session')||'boss',busy=false,voiceOutput=localStorage.getItem('mira_voice_output')==='on';
function updateVoiceButton(){voiceOutBtn.textContent=voiceOutput?'🔊':'🔇';voiceOutBtn.classList.toggle('active',voiceOutput)}
function stopSpeaking(){if('speechSynthesis'in window)window.speechSynthesis.cancel()}
function toggleVoiceOutput(){if(!('speechSynthesis'in window)){add('assistant','Boss, browser voice output support nahi karta.');return}voiceOutput=!voiceOutput;localStorage.setItem('mira_voice_output',voiceOutput?'on':'off');if(!voiceOutput)stopSpeaking();updateVoiceButton()}
function pickVoice(text){let vs=speechSynthesis.getVoices();let roman=/\b(haan|nahi|kya|aap|main|mujhe|abhi|kar|karo|hai|hoon|batao|dekho|theek|boss|acha|achha|kyun|kaise|mein|mera|meri|aapka)\b/i.test(text);for(let lang of(roman?['en-IN','hi-IN']:['en-IN','en-US','hi-IN'])){let v=vs.find(x=>x.lang===lang);if(v)return v}return vs[0]}
function speak(text){if(!voiceOutput||!('speechSynthesis'in window)||!text.trim())return;stopSpeaking();let u=new SpeechSynthesisUtterance(text),v=pickVoice(text);u.rate=.98;u.pitch=1.02;if(v){u.voice=v;u.lang=v.lang}u.onstart=()=>document.getElementById('model').textContent='MIRA • speaking…';u.onend=()=>document.getElementById('model').textContent='Local AI • Ollama • Streaming';speechSynthesis.speak(u)}
function resize(e){e.style.height='auto';e.style.height=Math.min(e.scrollHeight,150)+'px'}function key(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}
function add(role,text){document.getElementById('welcome')?.remove();let row=document.createElement('div');row.className='msg '+role;let b=document.createElement('div');b.className='bubble';b.textContent=text;row.appendChild(b);chat.appendChild(row);chat.scrollTop=chat.scrollHeight;return b}
async function send(){let text=input.value.trim();if(!text||busy)return;busy=true;sendBtn.disabled=true;input.value='';resize(input);add('user',text);document.getElementById('model').textContent='MIRA • generating…';let bubble=add('assistant','');bubble.classList.add('typing');let full='';try{let r=await fetch('/api/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,session_id:session})});if(!r.ok)throw Error('Request failed ('+r.status+')');let reader=r.body.getReader(),decoder=new TextDecoder(),buffer='';while(true){let part=await reader.read();if(part.done)break;buffer+=decoder.decode(part.value,{stream:true});let lines=buffer.split('\n');buffer=lines.pop();for(let line of lines){if(!line.trim())continue;let d=JSON.parse(line);if(d.error)throw Error(d.error);if(d.delta){full+=d.delta;bubble.textContent=full;chat.scrollTop=chat.scrollHeight}}}bubble.classList.remove('typing');if(!full)full='Boss, empty response mila.';bubble.textContent=full;speak(full);loadSessions()}catch(e){bubble.classList.remove('typing');bubble.textContent='Boss, backend error: '+e.message}finally{busy=false;sendBtn.disabled=false;document.getElementById('model').textContent='Local AI • Ollama • Streaming';input.focus()}}
async function loadMessages(){try{let r=await fetch('/api/sessions/'+encodeURIComponent(session)+'/messages?limit=200'),d=await r.json();chat.innerHTML='';if(!d.messages?.length){chat.innerHTML='<div class="welcome" id="welcome"><div><div style="font-size:50px">✦</div><h1>Hello, Boss.</h1><p>New conversation ready.</p></div></div>';return}d.messages.forEach(x=>add(x.role,x.content))}catch(e){}}
async function loadSessions(){try{let r=await fetch('/api/sessions'),d=await r.json(),box=document.getElementById('sessions');box.innerHTML='';(d.sessions||[]).forEach(s=>{let b=document.createElement('button');b.className='session'+(s.id===session?' active':'');b.textContent=s.title;b.onclick=()=>switchSession(s.id);box.appendChild(b)})}catch(e){}}
async function switchSession(id){if(busy)return;stopSpeaking();session=id;localStorage.setItem('mira_session',session);await loadMessages();loadSessions()}
function newChat(){if(busy)return;stopSpeaking();session='boss-'+Date.now();localStorage.setItem('mira_session',session);fetch('/api/sessions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:session,title:'New conversation'})});chat.innerHTML='<div class="welcome" id="welcome"><div><div style="font-size:50px">✦</div><h1>Hello, Boss.</h1><p>New conversation ready.</p></div></div>';loadSessions()}
async function uploadDoc(el){let f=el.files?.[0];if(!f)return;add('user','📎 Upload: '+f.name);let fd=new FormData();fd.append('file',f);try{let r=await fetch('/api/files/upload',{method:'POST',body:fd}),d=await r.json();if(!r.ok)throw Error(d.detail||'Upload failed');add('assistant','Boss, document upload ho gaya: '+d.file+'\nAb bol sakte ho: "'+d.file+' read karo".')}catch(e){add('assistant','Boss, document upload nahi hua: '+e.message)}el.value=''}
async function loadMemory(){try{let r=await fetch('/api/memory'),d=await r.json(),box=document.getElementById('memories');box.innerHTML=d.memories?.length?d.memories.map(x=>`<div class="memory"><b>${esc(x.category)}</b>${esc(x.value)}</div>`).join(''):'<span style="color:var(--muted)">No long-term memories yet.</span>'}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toggleMemory(){document.getElementById('memoryPanel').classList.toggle('show');loadMemory()}
function voice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){add('assistant','Boss, browser speech recognition support nahi karta.');return}let r=new SR();r.lang='en-IN';r.interimResults=false;r.onstart=()=>document.getElementById('model').textContent='MIRA • listening…';r.onresult=e=>{input.value=e.results[0][0].transcript;resize(input);send()};r.onend=()=>document.getElementById('model').textContent='Local AI • Ollama • Streaming';r.start()}
function boot(){updateVoiceButton();fetch('/api/health').then(r=>r.json()).then(d=>{document.getElementById('statusText').textContent='Online';document.getElementById('sideStatus').textContent='MIRA '+d.version+' • Memory '+d.memory+' • Docs '+d.documents+' • Stream '+d.streaming}).catch(()=>{document.getElementById('statusText').textContent='Offline'});loadSessions();loadMessages()}boot();
</script></body></html>
