<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d12"><title>MIRA — Personal AI</title>
<style>
:root{--bg:#080a0f;--panel:#10131a;--panel2:#151923;--line:#252a36;--text:#f5f7fb;--muted:#8e97a8;--accent:#f4c542;--user:#202633;--danger:#ff6574}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% -10%,#24200e 0,transparent 35%),var(--bg);color:var(--text);font:15px Inter,system-ui,-apple-system,Segoe UI,sans-serif;height:100vh;overflow:hidden}.app{height:100vh;display:grid;grid-template-columns:250px 1fr}.side{border-right:1px solid var(--line);background:rgba(10,12,17,.92);padding:18px;display:flex;flex-direction:column;gap:18px}.brand{display:flex;align-items:center;gap:12px}.orb{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#fff1a8,var(--accent));box-shadow:0 0 28px #f4c54233;display:grid;place-items:center;color:#151515;font-weight:900}.brand b{font-size:19px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.new{border:1px solid #3a3f4b;background:var(--panel2);color:var(--text);border-radius:12px;padding:11px 13px;text-align:left;cursor:pointer}.new:hover{border-color:#777}.status{margin-top:auto;border:1px solid var(--line);border-radius:14px;padding:12px;background:#0e1117}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#51d88a;margin-right:7px;box-shadow:0 0 10px #51d88a}.main{min-width:0;display:flex;flex-direction:column}.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#0a0c11cc;backdrop-filter:blur(16px)}.top .model{color:var(--muted);font-size:12px}.chat{flex:1;overflow:auto;padding:28px max(20px,calc((100% - 900px)/2));scroll-behavior:smooth}.welcome{min-height:70%;display:grid;place-items:center;text-align:center}.welcome h1{font-size:42px;margin:8px 0;background:linear-gradient(90deg,#fff,#f4c542);-webkit-background-clip:text;color:transparent}.welcome p{color:var(--muted);max-width:560px;line-height:1.7}.msg{display:flex;margin:18px 0}.msg.user{justify-content:flex-end}.bubble{max-width:78%;padding:13px 16px;border-radius:18px;line-height:1.55;white-space:pre-wrap}.assistant .bubble{background:transparent;padding-left:0}.user .bubble{background:var(--user);border:1px solid #2b3240}.composer{padding:14px max(20px,calc((100% - 900px)/2)) 20px;background:linear-gradient(transparent,var(--bg) 25%)}.box{border:1px solid #303644;background:#11151d;border-radius:18px;padding:10px;display:flex;align-items:flex-end;gap:8px;box-shadow:0 12px 40px #0005}.box:focus-within{border-color:#555d6d}.box textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;max-height:150px;padding:8px}.icon{width:40px;height:40px;border:0;border-radius:12px;background:transparent;color:var(--muted);cursor:pointer;font-size:18px}.icon:hover{background:#20242d;color:var(--text)}.send{background:var(--accent);color:#111;font-weight:800}.send:hover{background:#ffd85b}.tools{display:flex;gap:4px}.hint{text-align:center;color:#626b7c;font-size:11px;margin-top:8px}.typing{color:var(--muted);font-size:13px}.panel{position:fixed;right:18px;top:76px;width:310px;background:#11151d;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 20px 60px #0009;display:none;z-index:5}.panel.show{display:block}.panel h3{margin:0 0 12px}.memory{padding:9px;border:1px solid var(--line);border-radius:10px;margin:7px 0;font-size:12px}.memory b{display:block;color:var(--accent)}@media(max-width:720px){.app{grid-template-columns:1fr}.side{display:none}.top{padding:0 14px}.chat{padding:20px 14px}.composer{padding:10px 12px 14px}.bubble{max-width:88%}.welcome h1{font-size:34px}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand"><div class="orb">M</div><div><b>MIRA</b><small>Personal AI Assistant</small></div></div><button class="new" onclick="newChat()">＋ New conversation</button><div class="status"><span class="dot"></span><b>Online</b><div id="sideStatus" style="color:var(--muted);font-size:11px;margin-top:5px">Connecting…</div></div></aside><main class="main"><header class="top"><div><b>MIRA</b><div class="model" id="model">AI assistant</div></div><button class="icon" onclick="toggleMemory()">🧠</button></header><section class="chat" id="chat"><div class="welcome" id="welcome"><div><div style="font-size:50px">✦</div><h1>Hello, Boss.</h1><p>MIRA is ready. Ask anything, use Hinglish, or tell me to remember something.</p></div></div></section><section class="composer"><div class="box"><div class="tools"><button class="icon" title="Voice input" onclick="voice()">🎙️</button></div><textarea id="input" rows="1" placeholder="Message MIRA…" onkeydown="key(event)" oninput="resize(this)"></textarea><button class="icon send" onclick="send()">➤</button></div><div class="hint">MIRA • private assistant interface • voice uses your browser</div></section></main></div><div class="panel" id="memoryPanel"><h3>🧠 MIRA Memory</h3><div id="memories">Loading…</div></div>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('input');let session='boss';
function resize(e){e.style.height='auto';e.style.height=Math.min(e.scrollHeight,150)+'px'}function key(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}function add(role,text){document.getElementById('welcome')?.remove();let row=document.createElement('div');row.className='msg '+role;let b=document.createElement('div');b.className='bubble';b.textContent=text;row.appendChild(b);chat.appendChild(row);chat.scrollTop=chat.scrollHeight}
async function send(){let text=input.value.trim();if(!text)return;input.value='';resize(input);add('user',text);let row=document.createElement('div');row.className='msg assistant';row.id='typing';row.innerHTML='<div class="bubble typing">MIRA is thinking…</div>';chat.appendChild(row);chat.scrollTop=chat.scrollHeight;try{let r=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,session_id:session})});let d=await r.json();document.getElementById('typing')?.remove();if(!r.ok)throw Error(d.detail||'Request failed');add('assistant',d.response||'No response');if(d.model)document.getElementById('model').textContent=d.model;loadMemory()}catch(e){document.getElementById('typing')?.remove();add('assistant','Boss, backend error: '+e.message)}}
async function loadMemory(){try{let r=await fetch('/memory?session_id='+encodeURIComponent(session));let d=await r.json();document.getElementById('memories').innerHTML=d.memories?.length?d.memories.map(x=>`<div class="memory"><b>${esc(x.category)}</b>${esc(x.value)}</div>`).join(''):'<span style="color:var(--muted)">No saved memories yet.</span>'}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toggleMemory(){document.getElementById('memoryPanel').classList.toggle('show');loadMemory()}function newChat(){session='boss-'+Date.now();chat.innerHTML='<div class="welcome" id="welcome"><div><div style="font-size:50px">✦</div><h1>Hello, Boss.</h1><p>New conversation ready.</p></div></div>'}
function voice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){add('assistant','Boss, is browser mein speech recognition available nahi hai.');return}let r=new SR();r.lang='en-IN';r.interimResults=false;r.onstart=()=>document.getElementById('model').textContent='Listening…';r.onresult=e=>{input.value=e.results[0][0].transcript;resize(input);send()};r.onerror=()=>{};r.onend=()=>document.getElementById('model').textContent='AI assistant';r.start()}
async function boot(){try{let r=await fetch('/');let d=await r.json();document.getElementById('sideStatus').textContent='MIRA '+d.version+' • Memory '+d.memory;document.getElementById('model').textContent=d.model||'AI assistant'}catch(e){document.getElementById('sideStatus').textContent='Backend unavailable'}}boot();
</script></body></html>
