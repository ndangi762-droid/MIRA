name: One-time composer fix
on:
  push:
    branches: [dev/mira-v7-voice-final]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix composer overflow automatically') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch composer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/web/index.html')
          s = p.read_text()
          if 'MIRA_COMPOSER_FIX_V1' in s:
              raise SystemExit(0)
          s = s.replace('.box{height:58px;', '/* MIRA_COMPOSER_FIX_V1 */.box{min-height:58px;height:auto;max-height:150px;')
          s = s.replace('display:flex;align-items:center;gap:8px;padding:6px 7px 6px 17px;box-shadow:', 'display:flex;align-items:flex-end;gap:8px;padding:6px 7px 6px 17px;overflow:hidden;box-shadow:')
          s = s.replace('max-height:100px;padding:9px 0;line-height:1.35}', 'max-height:120px;padding:9px 0;line-height:1.35;overflow-y:auto}')
          s = s.replace('.box{height:56px}', '.box{min-height:56px;height:auto;max-height:145px}')
          s = s.replace("function resize(e){e.style.height='auto';e.style.height=Math.min(e.scrollHeight,100)+'px'}", "function resize(e){e.style.height='auto';e.style.height=Math.min(e.scrollHeight,120)+'px'}")
          p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/web/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix composer overflow"
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/one-time-composer-fix.yml
          git commit -m "Remove temporary composer fix workflow"
          git push
